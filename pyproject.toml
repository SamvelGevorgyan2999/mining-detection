[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "miningguard"
version = "1.0.0"
description = "Cryptomining and browser cryptojacking detection with risk scoring"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "psutil>=5.9",
    "httpx>=0.26",
    "pydantic>=2.6",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8.0"]

[project.scripts]
miningguard = "miningguard.__main__:main"

[tool.setuptools.packages.find]
include = ["miningguard*"]

[tool.setuptools.package-data]
miningguard = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]


