services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: miningguard
      POSTGRES_USER: miningguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-miningguard}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miningguard -d miningguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      MG_DATABASE_URL: postgresql+psycopg://miningguard:${POSTGRES_PASSWORD:-miningguard}@db:5432/miningguard
      MG_API_TOKEN: ${MG_API_TOKEN:-}
    ports:
      - "8000:8000"

  # Linux-only. The agent must share the host's PID and network namespaces to
  # observe real processes and sockets; on Windows or macOS run the collector
  # directly with `python -m miningguard collect` instead.
  collector:
    build: .
    depends_on:
      - api
    command: ["python", "-m", "miningguard", "collect"]
    environment:
      MG_API_URL: http://api:8000
      MG_API_TOKEN: ${MG_API_TOKEN:-}
      MG_COLLECTOR_INTERVAL: "15"
    pid: host
    network_mode: host
    cap_add:
      - SYS_PTRACE
    volumes:
      - /etc/systemd:/etc/systemd:ro
      - /etc/cron.d:/etc/cron.d:ro
      - /var/spool/cron:/var/spool/cron:ro
    profiles:
      - linux-agent

volumes:
  pgdata:


